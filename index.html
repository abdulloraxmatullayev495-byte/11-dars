<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uyga vazifa</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

header {
    background: #1e293b;
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: #38bdf8;
}

.dark-btn {
    background: #facc15;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.categories {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 25px;
    flex-wrap: wrap;
}

.categories button {
    background: white;
    border: 2px solid #2563eb;
    color: #2563eb;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.categories button:hover,
.categories button.active {
    background: #2563eb;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.container h2 {
    margin-bottom: 25px;
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.product-card {
    background: white;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 5px 15px #0002;
}

.product-card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #f8fafc;
    border-radius: 10px;
}

.product-card h3 {
    margin: 15px 0 8px;
}

.product-card p {
    color: #2563eb;
    font-weight: bold;
    margin-bottom: 12px;
}

.btn-add {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
}

.cart {
    background: white;
    padding: 25px;
    margin: 40px auto;
    border-radius: 15px;
    box-shadow: 0 5px 15px #0002;
}

.cart h2 {
    margin-bottom: 15px;
}

.console-box {
    background: #1e293b;
    color: #7bf607;
    padding: 18px;
    border-radius: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.7;
}

.clear-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    margin-top: 15px;
    cursor: pointer;
    font-weight: bold;
}

body.dark {
    background: #020617;
    color: white;
}

body.dark .product-card,
body.dark .cart {
    background: #1e293b;
    color: white;
}

body.dark .categories button {
    background: #334155;
    color: white;
}

body.dark .categories button.active {
    background: #2563eb;
}

body.dark .product-card img {
    background: #334155;
}

body.dark .console-box {
    background: #020617;
}

@media(max-width: 600px) {
    header {
        padding: 18px;
    }

    header h2 {
        font-size: 19px;
    }

    .categories {
        gap: 8px;
    }

    .categories button {
        padding: 10px 13px;
    }
}
</style>
</head>

<body>

<header>
    <h2>Uyga vazifa market </h2>
    <button class="dark-btn" id="darkBtn">Kechqurun</button>
</header>

<div class="categories">
    <button class="active" onclick="kategoriya('Barchasi',this)">Barchasi</button>
    <button onclick="kategoriya('Butsilar',this)">Butsilar</button>
    <button onclick="kategoriya('Kiyimlar',this)">Kiyimlar</button>
    <button onclick="kategoriya('Aksessuarlar',this)">Smartwatch va Rukzak</button>
</div>

<div class="container">
    <h2>Mahsulotlar</h2>

    <div class="products" id="products"></div>

    <div class="cart">
        <h2> Savatcha (<span id="counter">0</span>)</h2>

        <div class="console-box" id="consoleView">
            Savatcha hozircha bo'sh
        </div>

        <button class="clear-btn" onclick="clearSavatcha()">
            Clear
        </button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
